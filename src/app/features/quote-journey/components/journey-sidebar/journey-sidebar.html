<nav aria-label="Application progress">
  <ol class="journey-list list-unstyled mb-0">
    @if (yourDetailsSection(); as details) {
      <li>
        <button
          class="journey-stage"
          type="button"
          [class.active]="activeStage() === 'your-details'"
          [disabled]="!canNavigateTo(details.index)"
          [attr.aria-current]="activeStage() === 'your-details' ? 'step' : null"
          (click)="selectSection(details.index)"
        >
          <span
            class="stage-marker"
            [class.completed]="completedSectionIds().has(details.section.id)"
            aria-hidden="true"
          >
            {{ completedSectionIds().has(details.section.id) ? '✓' : '1' }}
          </span>
          <span>{{ details.section.title }}</span>
          @if (completedSectionIds().has(details.section.id)) {
            <span class="visually-hidden">completed</span>
          }
        </button>
      </li>
    }

    <li>
      <div class="journey-stage stage-label" [class.active]="activeStage() === 'application'">
        <span class="stage-marker" [class.completed]="applicationComplete()" aria-hidden="true">
          {{ applicationComplete() ? '✓' : '2' }}
        </span>
        <span>Application</span>
        @if (applicationComplete()) {
          <span class="visually-hidden">completed</span>
        }
      </div>

      <ol class="section-list list-unstyled">
        @for (item of applicationSections(); track item.section.id) {
          <li>
            <button
              class="section-link"
              type="button"
              [class.active]="isSectionActive(item.index)"
              [class.completed]="completedSectionIds().has(item.section.id)"
              [disabled]="!canNavigateTo(item.index)"
              [attr.aria-current]="isSectionActive(item.index) ? 'step' : null"
              (click)="selectSection(item.index)"
            >
              <span>{{ item.section.title }}</span>
              @if (completedSectionIds().has(item.section.id)) {
                <span aria-hidden="true">✓</span>
                <span class="visually-hidden">completed</span>
              }
            </button>
          </li>
        }
      </ol>
    </li>

    <li>
      <div
        class="journey-stage stage-label"
        [class.active]="activeStage() === 'quote'"
        [attr.aria-current]="activeStage() === 'quote' ? 'step' : null"
      >
        <span class="stage-marker" aria-hidden="true">3</span>
        <span>Quote</span>
      </div>
    </li>
  </ol>
</nav>
