<main class="auth-page" id="main-content">
  <section class="card shadow-sm auth-card" aria-labelledby="register-title">
    <div class="card-body p-4 p-md-5">
      <p class="text-primary fw-semibold mb-2">Form Farm AI</p>
      <h1 class="h2 mb-2" id="register-title">Create your account</h1>
      <p class="text-body-secondary mb-4">
        Registration requests are accepted without confirming whether an email already exists.
      </p>
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label class="form-label" for="register-email">Email address</label>
          <input
            class="form-control"
            id="register-email"
            type="email"
            formControlName="email"
            autocomplete="email"
          />
        </div>
        <div class="mb-3">
          <label class="form-label" for="register-password">Password</label>
          <input
            class="form-control"
            id="register-password"
            type="password"
            formControlName="password"
            autocomplete="new-password"
            aria-describedby="password-help"
          />
          <p class="form-text" id="password-help">Use at least 15 characters.</p>
        </div>
        <div class="mb-3">
          <label class="form-label" for="confirm-password">Confirm password</label>
          <input
            class="form-control"
            id="confirm-password"
            type="password"
            formControlName="confirmPassword"
            autocomplete="new-password"
          />
        </div>
        @if (message()) {
          <p #statusMessage class="alert alert-danger" role="alert" tabindex="-1">
            {{ message() }}
          </p>
        }
        <button class="btn btn-primary w-100" type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Submitting…' : 'Register' }}
        </button>
      </form>
      <p class="text-center mt-4 mb-0"><a routerLink="/login">Back to sign in</a></p>
    </div>
  </section>
</main>
