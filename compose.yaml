services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: form_farm
      POSTGRES_USER: form_farm
      POSTGRES_PASSWORD: form_farm_local
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U form_farm -d form_farm']
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - form_farm_postgres:/var/lib/postgresql

volumes:
  form_farm_postgres:
