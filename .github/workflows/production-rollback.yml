name: Production application rollback

on:
  workflow_dispatch:
    inputs:
      application_commit:
        description: Full reviewed commit SHA of the prior deployment
        required: true
        type: string
      deployment:
        description: Previously promoted Vercel deployment ID or URL
        required: true
        type: string
      migration_level:
        description: Current reviewed migration filename
        required: true
        type: string
      schema_compatible:
        description: Operator attests that referenced evidence establishes current-schema compatibility
        required: true
        type: boolean
      compatibility_reference:
        description: Non-secret PR, issue, test, or rehearsal evidence for schema compatibility
        required: true
        type: string
      approval_reference:
        description: Non-secret rollback approval or incident reference
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate-target:
    name: Validate rollback target
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.application_commit }}
          fetch-depth: 0
      - name: Require immutable checked and schema-compatible target
        env:
          APPLICATION_COMMIT: ${{ inputs.application_commit }}
          SCHEMA_COMPATIBLE: ${{ inputs.schema_compatible }}
          ROLLBACK_DEPLOYMENT: ${{ inputs.deployment }}
          MIGRATION_LEVEL: ${{ inputs.migration_level }}
          COMPATIBILITY_REFERENCE: ${{ inputs.compatibility_reference }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SCHEMA_COMPATIBLE" = 'true'
          [[ "$APPLICATION_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROLLBACK_DEPLOYMENT" =~ ^(dpl_[A-Za-z0-9]+|https://[A-Za-z0-9.-]+\.vercel\.app)$ ]]
          [[ "$MIGRATION_LEVEL" =~ ^[0-9]{4}_[A-Za-z0-9_-]+\.sql$ ]]
          [[ "$COMPATIBILITY_REFERENCE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/#\ -]{0,199}$ ]]
          [[ "$APPROVAL_REFERENCE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/#\ -]{0,199}$ ]]
          test "$(git rev-parse HEAD)" = "$APPLICATION_COMMIT"
          git merge-base --is-ancestor "$APPLICATION_COMMIT" refs/remotes/origin/dev
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - name: Verify actual required checks for target commit
        env:
          APPLICATION_COMMIT: ${{ inputs.application_commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deployment/verify-required-checks.mjs

  rollback:
    name: Roll back compatible Production application
    needs: validate-target
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Production
    env:
      PRODUCTION_MIGRATION_LEVEL: ${{ inputs.migration_level }}
      PRODUCTION_REQUIRE_CURRENT_MIGRATIONS: 'true'
      PRODUCTION_DATABASE_NAME: ${{ vars.PRODUCTION_DATABASE_NAME }}
      PRODUCTION_DATABASE_ADMIN_ROLE: ${{ vars.PRODUCTION_DATABASE_ADMIN_ROLE }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      ROLLBACK_DEPLOYMENT: ${{ inputs.deployment }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.application_commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - name: Verify current schema before application rollback
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PRODUCTION_DATABASE_ADMIN_URL }}
        run: npm run db:prepare-production-release
      - name: Inspect reviewed rollback deployment
        env:
          APPLICATION_COMMIT: ${{ inputs.application_commit }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deployment/verify-vercel-deployment.mjs "$ROLLBACK_DEPLOYMENT" >/dev/null
      - name: Roll back application alias without reversing SQL
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@59.1.3 rollback "$ROLLBACK_DEPLOYMENT" --yes --token="$VERCEL_TOKEN"
      - name: Verify Production after application rollback
        env:
          PRODUCTION_SMOKE_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
        run: npm run deployment:production-smoke
      - name: Record non-secret application rollback evidence
        env:
          APPLICATION_COMMIT: ${{ inputs.application_commit }}
          COMPATIBILITY_REFERENCE: ${{ inputs.compatibility_reference }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        shell: bash
        run: |
          {
            echo '## Production application rollback record'
            printf '%s\n' "- Application commit: \`$APPLICATION_COMMIT\`"
            printf '%s\n' "- Migration level: \`$PRODUCTION_MIGRATION_LEVEL\`"
            printf '%s\n' "- Compatibility evidence: $COMPATIBILITY_REFERENCE"
            printf '%s\n' "- Compatibility attested by: @${GITHUB_ACTOR}"
            printf '%s\n' "- Approval/incident reference: $APPROVAL_REFERENCE"
            echo '- Result: application alias rollback and read-only smoke passed; no SQL reversal was attempted'
          } >> "$GITHUB_STEP_SUMMARY"
